# Decimal512/Int512 checks of the Sentio fork (tests/decimal512), for the fork's 26.3 Decimal512 branches only.
#
# decimal512-harness  GitHub-hosted, on every push to those branches and every PR into 26.3-lts-decimal512: the checks'
#                     own integrity without a ClickHouse binary (tests/decimal512/ci_harness.sh): vendored tool hashes,
#                     the pinned case lock, the stateless references regenerated by their independent oracle, the gate's
#                     fail-closed rules on synthetic evidence, script syntax, registry/selection consistency.
# decimal512-binary   the quick/full/nightly/release tiers (tests/decimal512/run_checks.sh) need a ClickHouse binary built from
#                     the commit, which a GitHub-hosted runner cannot build within its limits. They run only on manual
#                     dispatch, on a self-hosted runner labelled sentio-decimal512. The job builds the commit itself
#                     (tests/decimal512/ci_build.sh; the local release image with docker/sentio-decimal512/build.sh for the
#                     release tier) unless the runner provides DECIMAL512_BINARY / DECIMAL512_IMAGE; the baseline and Keeper
#                     binaries of the release tier always come from the runner (sha256-pinned files). No such runner is
#                     registered (2026-09-26): a dispatched binary job waits in the queue, it never reports a pass.
#
# Security: no secrets, a read-only token, pull_request (never pull_request_target), no deployment, no image push, no
# write to the repository. The other workflows of this tree trigger only on master, 2x.y branches or schedules.
name: Decimal512Checks

on:
  push:
    branches:
      - '26.3-lts-decimal512'
      - 'claude/26.3-lts-decimal512-*'
  pull_request:
    branches:
      - '26.3-lts-decimal512'
  workflow_dispatch:
    inputs:
      tier:
        description: 'binary tier for the self-hosted runner: quick, full, nightly or release (empty: harness only)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: decimal512-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: decimal512-harness
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out (sparse; no credentials kept)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            tests/decimal512
            tests/queries/0_stateless
          sparse-checkout-cone-mode: true
      - name: Binary-free checks
        run: bash tests/decimal512/ci_harness.sh

  binary:
    name: decimal512-binary
    if: github.event_name == 'workflow_dispatch' && inputs.tier != ''
    runs-on: [self-hosted, sentio-decimal512]
    timeout-minutes: 600
    steps:
      - name: Check out with submodules (no credentials kept)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Build this commit unless the runner provides DECIMAL512_BINARY
        run: |
          set -u
          if [ -z "${DECIMAL512_BINARY:-}" ]; then
            bin=$(bash tests/decimal512/ci_build.sh "$RUNNER_TEMP/build_release" --jobs "${DECIMAL512_BUILD_JOBS:-12}")
            echo "DECIMAL512_BINARY=$bin" >> "$GITHUB_ENV"
          fi
      - name: Local image of that binary (release tier) unless the runner provides DECIMAL512_IMAGE
        env:
          TIER: ${{ inputs.tier }}
        run: |
          set -u
          if [ "$TIER" = release ] && [ -z "${DECIMAL512_IMAGE:-}" ]; then
            out="$RUNNER_TEMP/image"
            bash docker/sentio-decimal512/build.sh --binary "$DECIMAL512_BINARY" --out "$out"
            tag=$(python3 -c "import json, sys; print(json.load(open(sys.argv[1]))['image']['tag'])" "$out/identity.json")
            echo "DECIMAL512_IMAGE=$tag" >> "$GITHUB_ENV"
          fi
      - name: run_checks.sh (tier from the dispatch input)
        # the runner provides the build of this commit and, for release, the baseline and Keeper binaries (paths in its
        # own environment); nothing here is passed as a secret
        env:
          TIER: ${{ inputs.tier }}
        run: |
          set -u
          case "$TIER" in quick|full|nightly|release) ;; *) echo "unknown tier: $TIER" >&2; exit 2;; esac
          out="$RUNNER_TEMP/decimal512-$TIER"
          extra=()
          if [ "$TIER" = release ]; then
            extra=(--source-clean --buggy-binary "$DECIMAL512_BASELINE" --keeper-binary "$DECIMAL512_KEEPER" --image "$DECIMAL512_IMAGE")
          fi
          bash tests/decimal512/run_checks.sh --tier "$TIER" --binary "$DECIMAL512_BINARY" --out "$out" \
            --source-sha "$GITHUB_SHA" "${extra[@]}"
